services:
  mysql:
    image: mysql:8.4.2
    # Disposable schemas need no replication log. This also lets the scoped
    # test account create trigger fixtures without global SUPER privileges.
    command: ["--skip-log-bin"]
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${ARCHERY_TEST_ROOT_PASSWORD:?runner required}
      MYSQL_DATABASE: ${ARCHERY_TEST_DATABASE:?runner required}
      MYSQL_USER: archery_test
      MYSQL_PASSWORD: ${ARCHERY_TEST_DB_PASSWORD:?runner required}
    healthcheck:
      # The entrypoint's temporary initialization server exposes a socket but
      # disables networking. Only the final TCP server is usable by backend.
      test: [CMD, mysqladmin, ping, --protocol=tcp, -h, 127.0.0.1]
      interval: 1s
      timeout: 3s
      retries: 60
  backend:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ./backend:/app:ro
      - ${ARCHERY_GO_MOD_CACHE:?runner required}:/go/pkg/mod:ro
      - ${ARCHERY_GO_BUILD_CACHE:?runner required}:/root/.cache/go-build
    environment:
      ARCHERY_ENVIRONMENT: ${ARCHERY_TEST_ENVIRONMENT:?runner required}
      MYSQL_HOST: ${ARCHERY_TEST_DB_HOST:?runner required}
      MYSQL_PORT: ${ARCHERY_TEST_DB_PORT:?runner required}
      MYSQL_DATABASE: ${ARCHERY_TEST_DATABASE:?runner required}
      MYSQL_USER: ${ARCHERY_TEST_DB_USER:?runner required}
      MYSQL_PASSWORD: ${ARCHERY_TEST_DB_PASSWORD:?runner required}
      ARCHERY_SESSION_KEY: ${ARCHERY_TEST_SESSION_KEY:?runner required}
      ARCHERY_DICTATOR_USERNAME: ${ARCHERY_TEST_DICTATOR_USERNAME:?runner required}
      ARCHERY_DICTATOR_PASSWORD: ${ARCHERY_TEST_DICTATOR_PASSWORD:?runner required}
      ARCHERY_DICTATOR_EMAIL: ${ARCHERY_TEST_DICTATOR_EMAIL:?runner required}
      ARCHERY_DICTATOR_OVERVIEW: ${ARCHERY_TEST_OVERVIEW:-}
      # cmd/testdb reads only this separate guard namespace before reset.
      ARCHERY_TEST_DATABASE: ${ARCHERY_TEST_DATABASE:?runner required}
      ARCHERY_TEST_DB_PASSWORD: ${ARCHERY_TEST_DB_PASSWORD:?runner required}
      ARCHERY_TEST_DB_HOST: ${ARCHERY_TEST_DB_HOST:?runner required}
      ARCHERY_TEST_DB_PORT: ${ARCHERY_TEST_DB_PORT:?runner required}
      ARCHERY_TEST_DB_USER: ${ARCHERY_TEST_DB_USER:?runner required}
      ARCHERY_TEST_ENVIRONMENT: ${ARCHERY_TEST_ENVIRONMENT:?runner required}
      ARCHERY_TEST_RUN_ID: ${ARCHERY_TEST_RUN_ID:?runner required}
      ARCHERY_MYSQL_INTEGRATION: "1"
      SEEDER_INTEGRATION_TEST: "1"
      GOTOOLCHAIN: local
      GOSUMDB: "off"
      GOPROXY: "off"
    depends_on:
      mysql:
        condition: service_healthy
    command: [go, run, .]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
  proxy:
    image: caddy:2.11.4-alpine
    ports:
      - "127.0.0.1::80"
    volumes:
      - ./reverse-proxy/Caddyfile:/etc/caddy/Caddyfile:ro
    environment:
      ARCHERY_SITE_ADDRESS: :80
      ARCHERY_ACME_EMAIL: ""
    tmpfs:
      - /data
      - /config
    depends_on:
      - frontend
      - backend
