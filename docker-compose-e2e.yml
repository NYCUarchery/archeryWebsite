services:
  mysql:
    image: mysql:8
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${ARCHERY_TEST_ROOT_PASSWORD:?runner required}
      MYSQL_DATABASE: ${ARCHERY_TEST_DATABASE:?runner required}
      MYSQL_USER: archery_test
      MYSQL_PASSWORD: ${ARCHERY_TEST_DB_PASSWORD:?runner required}
    healthcheck:
      # The entrypoint's temporary initialization server exposes a socket but
      # disables networking. Only the final TCP server is usable by backend.
      test: [CMD, mysqladmin, ping, --protocol=tcp, -h, 127.0.0.1]
      interval: 1s
      timeout: 3s
      retries: 60
  backend:
    image: golang:1.23
    working_dir: /app
    volumes:
      - ./backend:/app:ro
      - ${ARCHERY_TEST_CONFIG_DIR:?runner required}:/app/config:ro
      - ${ARCHERY_GO_MOD_CACHE:?runner required}:/go/pkg/mod:ro
      - ${ARCHERY_GO_BUILD_CACHE:?runner required}:/root/.cache/go-build
    environment:
      ARCHERY_TEST_CONFIG: /app/config/db.yaml
      ARCHERY_TEST_RUN_ID: ${ARCHERY_TEST_RUN_ID:?runner required}
      ARCHERY_MYSQL_INTEGRATION: "1"
      SEEDER_INTEGRATION_TEST: "1"
      GOTOOLCHAIN: local
      GOSUMDB: "off"
      GOPROXY: "off"
    depends_on:
      mysql:
        condition: service_healthy
    command: [go, run, .]
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.test
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
  proxy:
    image: nginx:1.27-alpine
    ports:
      - "127.0.0.1::80"
    volumes:
      - ./scripts/test-proxy.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
